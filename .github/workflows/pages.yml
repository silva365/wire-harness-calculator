name: Deploy web GUI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The page loads the Python package and example from the repo layout,
      # so publish the same layout and redirect the site root to web/.
      - name: Build site
        run: |
          mkdir -p _site
          cp -r web harnesscalc examples _site/
          find _site -name '__pycache__' -prune -exec rm -rf {} +
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=web/"><a href="web/">harnesscalc</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
