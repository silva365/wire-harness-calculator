[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnesscalc"
version = "0.1.0"
description = "Pick the wire gauge for each part on a harness BOM from its current, run length and terminals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
harnesscalc = "harnesscalc.cli:main"

[tool.setuptools]
packages = ["harnesscalc"]

[tool.setuptools.package-data]
harnesscalc = ["data/*.csv"]
